# Configuraciones de arranque generales de mi app de spring
# Siempre se cargan
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
# driver class name es opcional y recomendado solo si la versión de spring lo pide (ya viene configurado en versiones actuales)
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Para visualizar y debuggear las querys
#spring.jpa.show-sql=true

# healthcheck
management.endpoints.web.exposure.include=health

# exposición del healthcheck
# always -> cualquier ve el healthcheck
# never -> nadie ve el detalle del healthcheck
# when_authorized -> gestionado por permisos de spring security
management.endpoint.health.show-details=always

# Definir el comportamiento de la estructura de bdd
#spring.jpa.hibernate.ddl-auto=update
# es opcinal y se los recomiendo cuando su app no reconozca el conector
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
#server.port=0 para manejar el choque de puertos